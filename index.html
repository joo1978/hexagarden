<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>헥사가든</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF6ED;
    --card:#FFFDF9;
    --ink:#5B4A46;
    --ink-soft:#9C8A85;
    --line:#F0DCE4;
    --tile:#FFE3EE;
    --tile-deep:#FF9EC4;
    --accent:#FF6FA5;
    --accent-deep:#E14C86;
    --hex-line:#FFC7DE;
  }
  body.theme-lv2{
    --tile:#FFE4D6;
    --tile-deep:#FFAE8A;
    --accent:#FF8A5C;
    --accent-deep:#E56A3E;
    --hex-line:#FFCDB3;
  }
  body.theme-lv3{
    --tile:#FFEDB8;
    --tile-deep:#F2A93B;
    --accent:#F2A93B;
    --accent-deep:#D98A1E;
    --hex-line:#FFDE9E;
  }
  body.theme-lv4{
    --tile:#F3D3DC;
    --tile-deep:#D98BA0;
    --accent:#D9678A;
    --accent-deep:#B23A56;
    --hex-line:#EFC2D2;
  }
  body.theme-lv5{
    --tile:#E8DFFB;
    --tile-deep:#B79EF0;
    --accent:#8E6BD8;
    --accent-deep:#6B4FB0;
    --hex-line:#D3C2F5;
  }
  body.theme-lv6{
    --tile:#E4D5F0;
    --tile-deep:#6B4C7A;
    --accent:#6B4C7A;
    --accent-deep:#4A3355;
    --hex-line:#C9AFDA;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; overflow-x:hidden;}
  body{
    background:
      radial-gradient(circle at 12% 8%, #FFE9F1 0%, transparent 42%),
      radial-gradient(circle at 88% 92%, #FFF3D6 0%, transparent 42%),
      var(--cream);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:20px 12px 40px;
    transition:background .3s ease;
  }
  .wrap{ width:100%; max-width:760px; min-width:0; }

  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:25px;
    text-align:center;
    margin:4px 0 2px;
    letter-spacing:-0.3px;
  }
  .subtitle{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:14px;

  }

    justify-content:center;
    align-items:center;

    font-size:40px;
    height:48px;
  }

  .pot.win{ animation:winPop .5s ease; }
  @keyframes winPop{
    0%{ transform:scale(1) rotate(0);}
    40%{ transform:scale(1.3) rotate(-8deg);}
    70%{ transform:scale(1.1) rotate(6deg);}
    100%{ transform:scale(1) rotate(0);}
  }

  .stats{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--card);
    border:2px solid var(--line);

    padding:10px 14px;

  .stat{ text-align:center; min-width:64px; }
  .stat .label{ font-size:10px; color:var(--ink-soft); font-weight:600; font-family:'Nunito',sans-serif; }
  .stat .value{ font-size:20px; font-weight:700; }

    border-radius:50%;
    border:2px solid var(--ink);
    background:var(--accent);

  }
  .reset-btn:active{ transform:translateY(3px); box-shadow:0 0 0 var(--accent-deep); }

  .diff-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .diff-btn{
    flex:1 1 30%;
    min-width:90px;
    padding:9px 4px;
    border-radius:12px;
    border:2px solid var(--line);

    font-weight:600;
    font-size:13px;
    color:var(--ink-soft);

    border-color:var(--tile-deep);

  .option-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    font-size:12.5px;

  .option-row.locked{ color:var(--accent-deep); }

    background:var(--card);

    border-radius:10px;
    border:none;
    background:transparent;

    font-weight:700;
    font-size:13px;
    color:var(--ink-soft);
    cursor:pointer;

  .mode-btn.active{ background:var(--tile); color:var(--ink); }

  .board-frame{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:18px;
    padding:14px 10px;
    display:flex;
    justify-content:center;
    overflow-x:auto;
    width:100%;
    min-width:0;
    max-width:100%;

  .board-inner{
    display:flex;
    align-items:flex-start;
    gap:6px;
    min-width:0;
  }
  .row-hints{
    display:flex;
    flex-direction:column;
    gap:0;
  }
  .row-hint{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:12px;
    color:var(--accent-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    width:20px;
  }
  .board{
    position:relative;
  }
  .cell{
    position:absolute;
    background:var(--hex-line);
    border:none;
    padding:0;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    cursor:pointer;
    user-select:none;
    transition: filter .1s ease;
  }
  .cell:active{ filter:brightness(0.96); }
  .cell-fill{
    position:absolute;
    inset:1.5px;
    background:var(--tile);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--ink);
    pointer-events:none;
  }
  .cell.revealed .cell-fill{ background:var(--card); }
  .cell.revealed{ cursor:default; }
  .cell.revealed:active{ filter:none; }
  .cell.mine.exploded .cell-fill{ background:#FF8080; }
  .cell.flagged .cell-fill{ background:var(--accent); color:#fff; }
  .n1{ color:#6FCDAE; }
  .n2{ color:#B79EF0; }
  .n3{ color:var(--accent); }

  .n5{ color:#C2622A; }
  .n6{ color:#3E9B8A; }

    font-size:12px;
    color:var(--ink-soft);

    font-weight:700;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;

    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:12.5px;

    flex-shrink:0;
    color:var(--ink-soft);
  }

    flex:1;
    font-size:16px;
    line-height:1.5;
    word-break:break-all;
  }

    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:12px;
    color:var(--ink-soft);
    flex-shrink:0;

<body class="theme-lv1">

<script>
const LEVELS = {
  lv1: { rows:8,  cols:9,  mines:10, flower:'🌸', theme:'theme-lv1', hintMode:'none',     label:'쉬움' },
  lv2: { rows:9,  cols:10, mines:15, flower:'🌷', theme:'theme-lv2', hintMode:'none',     label:'초중급' },
  lv3: { rows:10, cols:12, mines:20, flower:'🌻', theme:'theme-lv3', hintMode:'optional', label:'보통' },
  lv4: { rows:11, cols:13, mines:26, flower:'🌹', theme:'theme-lv4', hintMode:'always',   label:'고급' },
  lv5: { rows:13, cols:15, mines:38,  flower:'🪻', theme:'theme-lv5', hintMode:'always', label:'매우어려움' },
  lv6: { rows:30, cols:30, mines:190, flower:'🏵️', theme:'theme-lv6', hintMode:'always', label:'지옥' }
};
const LEVEL_ORDER = ['lv1','lv2','lv3','lv4','lv5','lv6'];
const WILTED = '🥀';
let SIZE = 30;                 // hex circumradius (recalculated per screen size)
let HEX_W = Math.round(SIZE*Math.sqrt(3));
let HEX_H = SIZE*2;
let ROW_STEP = HEX_H*0.75;

function updateHexMetrics(){
  const frameWidth = document.querySelector('.board-frame').clientWidth || window.innerWidth;
  const availableForBoard = Math.max(180, frameWidth - 60); // minus padding + row-hint gutter
  const perColumn = availableForBoard / (cols + 0.5);
  let size = perColumn / Math.sqrt(3);
  size = Math.max(18, Math.min(38, size));
  SIZE = size;
  HEX_W = Math.round(SIZE*Math.sqrt(3));
  HEX_H = SIZE*2;
  ROW_STEP = HEX_H*0.75;
}

let level = 'lv1';
let rows, cols, mineCount;
let mineGrid = [];
let adjGrid = [];
let revealed = [];
let flagged = [];
let rowMineCounts = [];
let revealedSafeCount = 0;
let gameOver = false;
let gameWon = false;
let firstClick = true;
let timerInterval = null;
let seconds = 0;
let flagPlacementMode = false;
let showRowHints = false;

const boardEl = document.getElementById('board');
const rowHintsEl = document.getElementById('rowHints');
const mineCountEl = document.getElementById('mineCount');
const timerEl = document.getElementById('timer');
const msgEl = document.getElementById('msg');
const bestEl = document.getElementById('best');
const potEl = document.getElementById('pot');
const resetBtn = document.getElementById('resetBtn');
const digModeBtn = document.getElementById('digMode');
const flagModeBtn = document.getElementById('flagMode');
const optionRow = document.getElementById('optionRow');
const gardenBtn = document.getElementById('gardenBtn');
const gardenPanel = document.getElementById('gardenPanel');

document.querySelectorAll('.diff-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    level = btn.dataset.level;
    document.body.className = LEVELS[level].theme;
    startGame();
  });
});

digModeBtn.addEventListener('click', ()=>{
  flagPlacementMode = false;
  digModeBtn.classList.add('active');
  flagModeBtn.classList.remove('active');
});
flagModeBtn.addEventListener('click', ()=>{
  flagPlacementMode = true;
  flagModeBtn.classList.add('active');
  digModeBtn.classList.remove('active');
});
resetBtn.addEventListener('click', startGame);

function make2D(r,c,val){
  const g=[];
  for(let i=0;i<r;i++){ g.push(new Array(c).fill(val)); }
  return g;
}

// ---------- hex neighbor math (odd-r offset via axial conversion) ----------
function offsetToAxial(col,row){
  return { q: col - (row - (row & 1)) / 2, r: row };
}
function axialToOffset(q,r){
  return { col: q + (r - (r & 1)) / 2, row: r };
}
const AXIAL_DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
function neighborsOf(row,col,rr,cc){
  const {q,r} = offsetToAxial(col,row);
  const result=[];
  for(const [dq,dr] of AXIAL_DIRS){
    const off = axialToOffset(q+dq, r+dr);
    if(off.row>=0 && off.row<rr && off.col>=0 && off.col<cc){
      result.push({row:off.row, col:off.col});
    }
  }
  return result;
}

// ---------- generation with no-guess validation ----------
function tryGenerate(rr,cc,mc,safeR,safeC){
  const safeSet = new Set();
  safeSet.add(safeR+','+safeC);
  for(const n of neighborsOf(safeR,safeC,rr,cc)) safeSet.add(n.row+','+n.col);

  const candidates = [];
  for(let r=0;r<rr;r++) for(let c=0;c<cc;c++){
    if(!safeSet.has(r+','+c)) candidates.push({row:r,col:c});
  }
  // shuffle
  for(let i=candidates.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [candidates[i],candidates[j]] = [candidates[j],candidates[i]];
  }
  const mg = make2D(rr,cc,false);
  for(let i=0;i<mc && i<candidates.length;i++){
    mg[candidates[i].row][candidates[i].col] = true;
  }
  const ag = make2D(rr,cc,0);
  for(let r=0;r<rr;r++) for(let c=0;c<cc;c++){
    if(mg[r][c]) continue;
    let cnt=0;
    for(const n of neighborsOf(r,c,rr,cc)) if(mg[n.row][n.col]) cnt++;
    ag[r][c]=cnt;
  }

  const sim = { rows:rr, cols:cc, mineGrid:mg, adjGrid:ag, revealed:make2D(rr,cc,false), flagged:make2D(rr,cc,false) };
  floodReveal(safeR,safeC,sim);
  solve(sim);

  let safeRevealed=0;
  for(let r=0;r<rr;r++) for(let c=0;c<cc;c++){
    if(sim.revealed[r][c]) safeRevealed++;
  }
  const totalSafe = rr*cc - mc;
  return { solved: safeRevealed===totalSafe, mineGrid:mg, adjGrid:ag };
}

function floodReveal(row,col,state){
  if(state.revealed[row][col] || state.mineGrid[row][col]) return;
  state.revealed[row][col]=true;
  if(state.adjGrid[row][col]===0){
    for(const n of neighborsOf(row,col,state.rows,state.cols)){
      if(!state.mineGrid[n.row][n.col] && !state.revealed[n.row][n.col]){
        floodReveal(n.row,n.col,state);
      }
    }
  }
}

function solve(state){
  let progress = true;
  while(progress){
    progress = false;
    const constraints = [];
    for(let r=0;r<state.rows;r++){
      for(let c=0;c<state.cols;c++){
        if(state.revealed[r][c]){
          const nbs = neighborsOf(r,c,state.rows,state.cols);
          const unknown=[]; let flaggedCount=0;
          for(const n of nbs){
            if(state.flagged[n.row][n.col]) flaggedCount++;
            else if(!state.revealed[n.row][n.col]) unknown.push(n);
          }
          if(unknown.length>0){
            constraints.push({ cells:unknown, rem: state.adjGrid[r][c]-flaggedCount });
          }
        }
      }
    }
    for(const con of constraints){
      if(con.rem===0){
        for(const cell of con.cells){
          if(!state.revealed[cell.row][cell.col]){ floodReveal(cell.row,cell.col,state); progress=true; }
        }
      } else if(con.rem===con.cells.length){
        for(const cell of con.cells){
          if(!state.flagged[cell.row][cell.col]){ state.flagged[cell.row][cell.col]=true; progress=true; }
        }
      }
    }
    if(progress) continue;

    let found=false;
    for(let i=0;i<constraints.length && !found;i++){
      for(let j=0;j<constraints.length && !found;j++){
        if(i===j) continue;
        const A=constraints[i], B=constraints[j];
        const setA = new Set(A.cells.map(x=>x.row+','+x.col));
        const setB = new Set(B.cells.map(x=>x.row+','+x.col));
        if(setA.size===0 || setB.size===0 || setA.size>=setB.size) continue;
        let subset=true;
        for(const k of setA){ if(!setB.has(k)){ subset=false; break; } }
        if(!subset) continue;
        const diffCells = B.cells.filter(x=>!setA.has(x.row+','+x.col));
        const diffRem = B.rem - A.rem;
        if(diffRem===0){
          for(const cell of diffCells){
            if(!state.revealed[cell.row][cell.col]){ floodReveal(cell.row,cell.col,state); progress=true; }
          }
          found = progress;
        } else if(diffRem===diffCells.length){
          for(const cell of diffCells){
            if(!state.flagged[cell.row][cell.col]){ state.flagged[cell.row][cell.col]=true; progress=true; }
          }
          found = progress;
        }
      }
    }
  }
}

function generateWithRetry(rr,cc,mc,safeR,safeC){
  let mines = mc;
  for(let tier=0; tier<6; tier++){
    for(let attempt=0; attempt<400; attempt++){
      const res = tryGenerate(rr,cc,mines,safeR,safeC);
      if(res.solved) return { mineGrid:res.mineGrid, adjGrid:res.adjGrid, mines };
    }
    mines = Math.max(1, mines-1);
  }
  const res = tryGenerate(rr,cc,mines,safeR,safeC);
  return { mineGrid:res.mineGrid, adjGrid:res.adjGrid, mines };
}

// ---------- game flow ----------
async function loadBest(){
  try{
    const res = await window.storage.get('hexagarden-best:'+level);
    if(res && res.value){
      const t = JSON.parse(res.value);
      bestEl.textContent = '최고 기록: ' + t.time + '초';
    } else { bestEl.textContent=''; }
  }catch(e){ bestEl.textContent=''; }
}
async function saveBest(time){
  try{
    const res = await window.storage.get('hexagarden-best:'+level).catch(()=>null);
    let current=null;
    if(res && res.value) current = JSON.parse(res.value).time;
    if(current===null || time<current){
      await window.storage.set('hexagarden-best:'+level, JSON.stringify({time}));
      bestEl.textContent = '🎉 새 기록! ' + time + '초';
    } else {
      bestEl.textContent = '최고 기록: ' + current + '초';
    }
  }catch(e){}
}

async function loadGarden(){
  try{
    const res = await window.storage.get('hexagarden-garden');
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){}
  const empty = {};
  LEVEL_ORDER.forEach(k=>empty[k]=0);
  return empty;
}
async function incrementGarden(lvl){
  const g = await loadGarden();
  g[lvl] = (g[lvl]||0)+1;
  try{ await window.storage.set('hexagarden-garden', JSON.stringify(g)); }catch(e){}
  return g;
}
function renderGardenPanel(counts){
  gardenPanel.innerHTML = '';
  LEVEL_ORDER.forEach(k=>{
    const cfg = LEVELS[k];
    const count = counts[k]||0;
    const row = document.createElement('div');
    row.className='garden-row';
    const label = document.createElement('div');
    label.className='g-label';
    label.textContent = cfg.label;
    const flowers = document.createElement('div');
    flowers.className='g-flowers';
    if(count===0){
      flowers.textContent='아직 빈 화단이에요';
      flowers.style.color='var(--ink-soft)';
      flowers.style.fontSize='12px';
    } else {
      const shown = Math.min(count,20);
      flowers.textContent = cfg.flower.repeat(shown) + (count>20 ? ' …' : '');
    }
    const cnt = document.createElement('div');
    cnt.className='g-count';
    cnt.textContent = count+'송이';
    row.appendChild(label);
    row.appendChild(flowers);
    row.appendChild(cnt);
    gardenPanel.appendChild(row);
  });
}
gardenBtn.addEventListener('click', async ()=>{
  const open = gardenPanel.classList.toggle('open');
  gardenBtn.textContent = open ? '🌷 정원 닫기' : '🌷 나의 정원 보기';
  if(open){
    const counts = await loadGarden();
    renderGardenPanel(counts);
  }
});

function renderOptionRow(){
  const cfg = LEVELS[level];
  optionRow.innerHTML = '';
  optionRow.classList.remove('locked');
  if(cfg.hintMode==='none'){
    showRowHints = false;
    optionRow.textContent = '';
  } else if(cfg.hintMode==='optional'){
    const label = document.createElement('label');
    label.style.display='flex'; label.style.alignItems='center'; label.style.gap='6px'; label.style.cursor='pointer';
    const cb = document.createElement('input');
    cb.type='checkbox'; cb.checked = showRowHints;
    cb.addEventListener('change', ()=>{ showRowHints = cb.checked; renderBoard(); });
    label.appendChild(cb);
    label.appendChild(document.createTextNode('가로줄 잡초 총합 힌트 보기'));
    optionRow.appendChild(label);
  } else if(cfg.hintMode==='always'){
    showRowHints = true;
    optionRow.classList.add('locked');
    optionRow.textContent = '🚩 가로줄 잡초 총합 힌트 항상 표시';
  }
}

function startGame(){
  const cfg = LEVELS[level];
  rows = cfg.rows; cols = cfg.cols; mineCount = cfg.mines;
  mineGrid=null; adjGrid=null;
  revealed = make2D(rows,cols,false);
  flagged = make2D(rows,cols,false);
  revealedSafeCount = 0;
  gameOver = false;
  gameWon = false;
  firstClick = true;
  seconds = 0;
  clearInterval(timerInterval);
  timerEl.textContent='0';
  mineCountEl.textContent = mineCount;
  msgEl.textContent = '첫 칸을 눌러 화단을 열어보세요';
  potEl.className = 'pot';
  potEl.textContent = '🪴';
  renderOptionRow();
  loadBest();
  updateHexMetrics();
  layoutBoard();
  renderEmptyBoard();
}

function relayout(){
  if(!rows || !cols) return;
  updateHexMetrics();
  layoutBoard();
  const cells = boardEl.children;
  for(let i=0;i<cells.length;i++){
    const btn = cells[i];
    const r = +btn.dataset.row, c = +btn.dataset.col;
    const {left,top} = cellPixelPos(r,c);
    btn.style.left = left+'px';
    btn.style.top = top+'px';
    btn.style.width = HEX_W+'px';
    btn.style.height = HEX_H+'px';
  }
  renderRowHints();
}
let relayoutTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(relayoutTimer);
  relayoutTimer = setTimeout(relayout, 150);
});

function layoutBoard(){
  const width = HEX_W*cols + HEX_W/2;
  const height = ROW_STEP*(rows-1) + HEX_H;
  boardEl.style.width = width+'px';
  boardEl.style.height = height+'px';
}

function cellPixelPos(row,col){
  const left = col*HEX_W + (row%2 ? HEX_W/2 : 0);
  const top = row*ROW_STEP;
  return {left,top};
}

function renderEmptyBoard(){
  boardEl.innerHTML='';
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const btn = document.createElement('button');
      btn.className='cell';
      const {left,top} = cellPixelPos(r,c);
      btn.style.left=left+'px';
      btn.style.top=top+'px';
      btn.style.width=HEX_W+'px';
      btn.style.height=HEX_H+'px';
      btn.dataset.row=r; btn.dataset.col=c;
      const fill = document.createElement('div');
      fill.className = 'cell-fill';
      btn.appendChild(fill);
      btn.addEventListener('click', ()=>handleCellClick(r,c));
      btn.addEventListener('contextmenu', (e)=>{ e.preventDefault(); handleFlag(r,c); });
      boardEl.appendChild(btn);
    }
  }
  renderRowHints();
}

function renderRowHints(){
  rowHintsEl.innerHTML='';
  rowHintsEl.style.paddingTop='0px';
  for(let r=0;r<rows;r++){
    const div = document.createElement('div');
    div.className='row-hint';
    div.style.height = ROW_STEP+'px';
    if(r===rows-1) div.style.height = HEX_H+'px';
    if(showRowHints && rowMineCounts.length){
      div.textContent = '🥀'+rowMineCounts[r];
    }
    rowHintsEl.appendChild(div);
  }
}

function renderBoard(){
  const cells = boardEl.children;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const idx = r*cols+c;
      const btn = cells[idx];
      const fill = btn.querySelector('.cell-fill');
      btn.className='cell';
      fill.className='cell-fill';
      fill.textContent='';
      if(revealed[r][c]){
        btn.classList.add('revealed');
        if(mineGrid && mineGrid[r][c]){
          btn.classList.add('mine');
          fill.textContent = WILTED;
        } else {
          const n = adjGrid[r][c];
          if(n>0){ fill.textContent=n; fill.classList.add('n'+n); }
          else { fill.textContent = LEVELS[level].flower; }
        }
      } else if(flagged[r][c]){
        btn.classList.add('flagged');
        fill.textContent = '🚩';
      }
    }
  }
  renderRowHints();
}

function handleCellClick(r,c){
  if(gameOver||gameWon) return;
  if(flagged[r][c]) return;

  if(firstClick){
    const gen = generateWithRetry(rows,cols,mineCount,r,c);
    mineGrid = gen.mineGrid;
    adjGrid = gen.adjGrid;
    mineCount = gen.mines;
    mineCountEl.textContent = mineCount;
    rowMineCounts = [];
    for(let rr=0;rr<rows;rr++){
      let cnt=0;
      for(let cc=0;cc<cols;cc++) if(mineGrid[rr][cc]) cnt++;
      rowMineCounts.push(cnt);
    }
    firstClick=false;
    startTimer();
  }

  if(flagPlacementMode){ handleFlag(r,c); return; }
  if(revealed[r][c]) return;

  if(mineGrid[r][c]){
    revealed[r][c]=true;
    for(let rr=0;rr<rows;rr++) for(let cc=0;cc<cols;cc++) if(mineGrid[rr][cc]) revealed[rr][cc]=true;
    renderBoard();
    const cells = boardEl.children;
    cells[r*cols+c].classList.add('exploded');
    endGame(false);
    return;
  }

  const before = countRevealed();
  const state = {rows,cols,mineGrid,adjGrid,revealed,flagged};
  floodReveal(r,c,state);
  renderBoard();
  checkWin();
}

function handleFlag(r,c){
  if(gameOver||gameWon||firstClick) return;
  if(revealed[r][c]) return;
  flagged[r][c] = !flagged[r][c];
  renderBoard();
}

function countRevealed(){
  let cnt=0;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(revealed[r][c] && !mineGrid[r][c]) cnt++;
  return cnt;
}

function checkWin(){
  const totalSafe = rows*cols - mineCount;
  if(countRevealed()===totalSafe){
    endGame(true);
  }
}

function endGame(won){
  gameOver=!won; gameWon=won;
  clearInterval(timerInterval);
  if(won){
    potEl.className='pot win';
    potEl.textContent = LEVELS[level].flower+'✨';
    msgEl.textContent = '🎉 화단이 완성됐어요! 추측 없이 논리로 다 풀었어요!';
    saveBest(seconds);
    launchConfetti();
    incrementGarden(level).then(counts=>{
      if(gardenPanel.classList.contains('open')) renderGardenPanel(counts);
    });
  } else {
    potEl.className='pot';
    potEl.textContent='🥀';
    msgEl.textContent = '앗, 잡초였어요. 사실 힌트로 확정할 수 있는 칸이었어요 — 다시 살펴보며 도전해봐요!';
  }
}

function startTimer(){
  timerInterval = setInterval(()=>{ seconds++; timerEl.textContent=seconds; }, 1000);
}

function launchConfetti(){
  const flower = LEVELS[level].flower;
  const emojis = [flower,'✨','🌿'];
  for(let i=0;i<24;i++){
    setTimeout(()=>{
      const span=document.createElement('div');
      span.className='confetti';
      span.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      span.style.left = Math.random()*100+'vw';
      span.style.animationDuration = (2+Math.random()*1.5)+'s';
      document.body.appendChild(span);
      setTimeout(()=>span.remove(),3600);
    }, i*60);
  }
}

startGame();
</script>
</body>
</html>
