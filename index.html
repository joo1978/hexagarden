<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>헥사가든</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF6ED;
    --card:#FFFDF9;
    --ink:#5B4A46;
    --ink-soft:#9C8A85;
    --line:#F0DCE4;
    --tile:#F3D3DC;
    --tile-deep:#D98BA0;
    --accent:#D9678A;
    --accent-deep:#B23A56;
    --hex-line:#EFC2D2;
    --flower-bg:none;
    --flower-bg-faint:none;
  }
  body.theme-lv2{
    --tile:#E8DFFB;
    --tile-deep:#B79EF0;
    --accent:#8E6BD8;
    --accent-deep:#6B4FB0;
    --hex-line:#D3C2F5;
  }
  body.theme-lv3{
    --tile:#E4D5F0;
    --tile-deep:#6B4C7A;
    --accent:#6B4C7A;
    --accent-deep:#4A3355;
    --hex-line:#C9AFDA;
  }
  body.theme-lv4{
    --tile:#FBD9DE;
    --tile-deep:#C23B4E;
    --accent:#C23B4E;
    --accent-deep:#8E1F30;
    --hex-line:#F0AEB9;
  }
  body.theme-lv5{
    --tile:#FBEFC9;
    --tile-deep:#C9A227;
    --accent:#C9A227;
    --accent-deep:#96751A;
    --hex-line:#EAD98C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; overflow-x:hidden;}
  body{
    background:
      radial-gradient(circle at 12% 8%, #FFE9F1 0%, transparent 42%),
      radial-gradient(circle at 88% 92%, #FFF3D6 0%, transparent 42%),
      var(--cream);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:20px 12px 40px;
    transition:background .3s ease;
  }
  .wrap{ width:100%; max-width:760px; min-width:0; }

  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:25px;
    text-align:center;
    margin:4px 0 2px;
    letter-spacing:-0.3px;
  }
  .subtitle{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:14px;
    font-weight:600;
  }

  /* ---------- character overlay ---------- */
  .char-overlay{
    position:fixed; inset:0; z-index:200;
    background:
      radial-gradient(circle at 12% 8%, #FFE9F1 0%, transparent 42%),
      radial-gradient(circle at 88% 92%, #FFF3D6 0%, transparent 42%),
      var(--cream);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .char-overlay.hidden{ display:none; }
  .char-overlay-card{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:22px;
    padding:26px 20px;
    max-width:420px;
    width:100%;
    text-align:center;
    box-shadow:0 8px 0 var(--line);
  }
  .char-overlay-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:19px;
    margin-bottom:4px;
  }
  .char-overlay-sub{
    font-size:12px;
    color:var(--ink-soft);
    font-weight:600;
    margin-bottom:18px;
  }
  .char-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
  }
  .char-card{
    background:var(--cream);
    border:2px solid var(--line);
    border-radius:16px;
    padding:14px 6px;
    cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    transition: transform .08s ease;
  }
  .char-card:active{ transform:translateY(2px); }
  .char-avatar{
    width:52px; height:52px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:26px;
    border:2px solid rgba(255,255,255,0.7);
  }
  .char-name{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:12.5px;
    color:var(--ink);
  }

  .char-bar{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-bottom:10px;
  }
  .char-chip{
    display:flex; align-items:center; gap:6px;
    background:var(--card);
    border:2px solid var(--line);
    border-radius:20px;
    padding:4px 12px 4px 4px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:12.5px;
  }
  .char-chip .char-avatar{ width:26px; height:26px; font-size:14px; border-width:1.5px; }
  .char-switch-btn{
    border:2px solid var(--line);
    background:var(--card);
    border-radius:20px;
    padding:6px 14px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:11.5px;
    color:var(--ink-soft);
    cursor:pointer;
  }

  .pot-zone{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:8px;
    font-size:40px;
    height:48px;
  }
  .pot{ transition:transform .2s ease; }
  .pot.win{ animation:winPop .5s ease; }
  @keyframes winPop{
    0%{ transform:scale(1) rotate(0);}
    40%{ transform:scale(1.3) rotate(-8deg);}
    70%{ transform:scale(1.1) rotate(6deg);}
    100%{ transform:scale(1) rotate(0);}
  }

  .stats{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--card);
    border:2px solid var(--line);
    border-radius:16px;
    padding:10px 14px;
    margin-bottom:12px;
    font-family:'Baloo 2', sans-serif;
  }
  .stat{ text-align:center; min-width:64px; }
  .stat .label{ font-size:10px; color:var(--ink-soft); font-weight:600; font-family:'Nunito',sans-serif; }
  .stat .value{ font-size:20px; font-weight:700; }
  .reset-btn{
    width:46px; height:46px;
    border-radius:50%;
    border:2px solid var(--ink);
    background:var(--accent);
    color:#fff;
    font-size:20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 3px 0 var(--accent-deep);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .reset-btn:active{ transform:translateY(3px); box-shadow:0 0 0 var(--accent-deep); }

  .diff-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .diff-btn{
    flex:1 1 30%;
    min-width:90px;
    padding:9px 4px;
    border-radius:12px;
    border:2px solid var(--line);
    background:var(--card);
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .diff-btn.active{
    background:var(--tile);
    border-color:var(--tile-deep);
    color:var(--ink);
    box-shadow:0 3px 0 var(--tile-deep);
    transform:translateY(-1px);
  }

  .option-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    min-height:20px;
  }
  .option-row input{ accent-color:var(--accent); width:16px; height:16px; }
  .option-row.locked{ color:var(--accent-deep); }

  .gesture-hint{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:700;
    margin-bottom:12px;
  }
  .mode-row{ display:flex; justify-content:center; margin-bottom:12px; }
  .mode-toggle{
    display:flex;
    background:var(--card);
    border:2px solid var(--line);
    border-radius:14px;
    padding:4px;
    gap:4px;
  }
  .mode-btn{
    padding:8px 20px;
    border-radius:10px;
    border:none;
    background:transparent;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .mode-btn.active{ background:var(--tile); color:var(--ink); }

  .zoom-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }
  .zoom-btn{
    width:34px; height:34px;
    border-radius:10px;
    border:2px solid var(--line);
    background:var(--card);
    color:var(--ink);
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:18px;
    line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    touch-action:manipulation;
  }
  .zoom-btn:disabled{ opacity:0.35; cursor:default; }
  .zoom-label{
    min-width:52px;
    text-align:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--ink-soft);
  }

  .campaign-timer{
    display:none;
    text-align:center;
    background:var(--card);
    border:2px solid var(--accent);
    border-radius:16px;
    padding:10px 14px;
    margin-bottom:12px;
  }
  .campaign-timer.show{ display:block; }
  .campaign-timer .ct-time{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:34px;
    color:var(--accent-deep);
    letter-spacing:1px;
  }
  .campaign-timer.urgent .ct-time{
    color:#D92B2B;
    animation:urgentPulse 1s ease-in-out infinite;
  }
  @keyframes urgentPulse{
    0%,100%{ opacity:1; } 50%{ opacity:0.4; }
  }
  .campaign-timer .ct-level{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .campaign-timer .ct-cancel{
    margin-top:6px;
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
  }
  .campaign-btn{
    display:block;
    width:100%;
    margin-bottom:12px;
    padding:11px 10px;
    border-radius:14px;
    border:none;
    background:linear-gradient(135deg, var(--accent), var(--accent-deep));
    color:#fff;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:14px;
    cursor:pointer;
  }
  .campaign-btn:active{ filter:brightness(0.95); }
  .campaign-btn:disabled{ opacity:0.5; }

  .board-frame{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:18px;
    padding:14px 10px;
    display:flex;
    justify-content:center;
    overflow-x:auto;
    width:100%;
    min-width:0;
    max-width:100%;
  }
  .board-inner{
    display:flex;
    align-items:flex-start;
    gap:6px;
    min-width:0;
  }
  .row-hints{
    display:flex;
    flex-direction:column;
    gap:0;
  }
  .row-hint{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:12px;
    color:var(--accent-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    width:20px;
  }
  .board{
    position:relative;
  }
  .cell{
    position:absolute;
    background:var(--hex-line);
    border:none;
    padding:0;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
    touch-action:manipulation;
    transition: filter .1s ease;
  }
  .cell:active{ filter:brightness(0.96); }
  .cell-fill{
    position:absolute;
    inset:1.5px;
    background-color:var(--tile);
    background-image:var(--flower-bg);
    background-size:cover;
    background-position:center;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--ink);
    pointer-events:none;
  }
  .cell.revealed .cell-fill{ background-color:var(--card); background-image:var(--flower-bg-faint); }
  .cell.revealed{ cursor:default; }
  .cell.revealed:active{ filter:none; }
  .cell.mine.exploded .cell-fill{ background:#FF8080; }
  .cell.flagged .cell-fill{ background:var(--accent); color:#fff; }
  .n1{ color:#6FCDAE; }
  .n2{ color:#B79EF0; }
  .n3{ color:var(--accent); }
  .n4{ color:#8E6BD8; }
  .n5{ color:#C2622A; }
  .n6{ color:#3E9B8A; }

  .msg{
    text-align:center;
    margin-top:14px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14.5px;
    min-height:40px;
  }
  .best{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
    font-weight:600;
  }

  .confetti{
    position:fixed;
    top:-20px;
    font-size:20px;
    pointer-events:none;
    animation: fall linear forwards;
    z-index:50;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(360deg); opacity:0.3; }
  }

  .bottom-btns{ display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  .garden-btn{
    display:block;
    margin:0;
    padding:9px 18px;
    border-radius:14px;
    border:2px solid var(--line);
    background:var(--card);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
  }
  .garden-panel{
    margin-top:12px;
    background:var(--card);
    border:2px solid var(--line);
    border-radius:16px;
    padding:14px;
    display:none;
  }
  .garden-panel.open{ display:block; }
  .garden-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 4px;
    border-bottom:1px dashed var(--line);
  }
  .garden-row:last-child{ border-bottom:none; }
  .garden-row .g-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:12.5px;
    width:76px;
    flex-shrink:0;
    color:var(--ink-soft);
  }
  .garden-row .g-flowers{
    flex:1;
    font-size:16px;
    line-height:1.5;
    word-break:break-all;
  }
  .garden-row .g-count{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:12px;
    color:var(--ink-soft);
    flex-shrink:0;
  }

  .rank-tabs{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .rank-tab{
    padding:6px 10px; border-radius:10px; border:2px solid var(--line);
    background:var(--cream); font-family:'Baloo 2', sans-serif; font-weight:700; font-size:11.5px;
    color:var(--ink-soft); cursor:pointer;
  }
  .rank-tab.active{ background:var(--tile); border-color:var(--tile-deep); color:var(--ink); }
  .rank-row{
    display:flex; align-items:center; gap:8px;
    padding:7px 4px; border-bottom:1px dashed var(--line);
    font-family:'Baloo 2', sans-serif; font-size:12.5px;
  }
  .rank-row:last-child{ border-bottom:none; }
  .rank-pos{ width:26px; text-align:center; font-weight:800; flex-shrink:0; }
  .rank-name{ flex:1; font-weight:700; display:flex; align-items:center; gap:6px; min-width:0; }
  .rank-time{ font-weight:700; color:var(--ink-soft); font-size:12px; flex-shrink:0; }
  .rank-empty{ text-align:center; color:var(--ink-soft); font-size:12px; padding:10px 0; }
  .rank-note{ text-align:center; color:var(--ink-soft); font-size:10.5px; margin-top:10px; line-height:1.5; }
</style>
</head>
<body class="theme-lv1">

<div class="char-overlay" id="charOverlay">
  <div class="char-overlay-card">
    <div class="char-overlay-title">🌷 누가 화단을 가꿀까요?</div>
    <div class="char-overlay-sub">캐릭터를 골라주세요 — 각자 기록이 따로 쌓여요</div>
    <div class="char-grid" id="charGrid"></div>
  </div>
</div>

<div class="wrap">
  <h1>🌺 헥사가든</h1>
  <div class="subtitle">추측 없이, 논리만으로 피어나는 화단</div>

  <div class="char-bar">
    <div class="char-chip" id="charChip"></div>
    <button class="char-switch-btn" id="charSwitchBtn">캐릭터 변경</button>
  </div>

  <div class="campaign-timer" id="campaignTimer">
    <div class="ct-time" id="ctTime">60:00</div>
    <div class="ct-level" id="ctLevel">1 / 5 단계 · 하드</div>
    <button class="ct-cancel" id="ctCancel">챌린지 중단</button>
  </div>

  <div class="pot-zone"><span class="pot" id="pot">🪴</span></div>

  <div class="stats">
    <div class="stat">
      <div class="label">🥀 남은 잡초</div>
      <div class="value" id="mineCount">0</div>
    </div>
    <button class="reset-btn" id="resetBtn">↻</button>
    <div class="stat">
      <div class="label">⏱ 시간</div>
      <div class="value" id="timer">0</div>
    </div>
  </div>

  <div class="diff-row">
    <button class="diff-btn active" data-level="lv1">하드 🌹</button>
    <button class="diff-btn" data-level="lv2">익스퍼트 🪻</button>
    <button class="diff-btn" data-level="lv3">마스터 🏵️</button>
    <button class="diff-btn" data-level="lv4">익스트림 🌺</button>
    <button class="diff-btn" data-level="lv5">멘사 🪷</button>
  </div>

  <button class="campaign-btn" id="campaignBtn">🏆 60분 챌린지 — 1단계부터 5단계까지 연속 클리어</button>

  <div class="option-row" id="optionRow"></div>

  <div class="mode-row">
    <div class="mode-toggle">
      <button class="mode-btn active" id="digMode">🌱 심기</button>
      <button class="mode-btn" id="flagMode">🚩 표시</button>
    </div>
  </div>

  <div class="zoom-row">
    <button class="zoom-btn" id="zoomOut" aria-label="축소">−</button>
    <div class="zoom-label" id="zoomLabel">100%</div>
    <button class="zoom-btn" id="zoomIn" aria-label="확대">+</button>
  </div>

  <div class="board-frame">
    <div class="board-inner">
      <div class="row-hints" id="rowHints"></div>
      <div class="board" id="board"></div>
    </div>
  </div>

  <div class="msg" id="msg">난이도를 고르고 첫 칸을 눌러보세요</div>
  <div class="best" id="best"></div>

  <div class="bottom-btns">
    <button class="garden-btn" id="gardenBtn">🌷 나의 정원 보기</button>
    <button class="garden-btn" id="rankingBtn">🏆 랭킹 보기</button>
  </div>
  <div class="garden-panel" id="gardenPanel"></div>
  <div class="garden-panel" id="rankingPanel"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
const LEVELS = {
  lv1: { rows:14, cols:16, mines:45,  flower:'🌹', theme:'theme-lv1', hintMode:'optional', label:'하드' },
  lv2: { rows:18, cols:20, mines:72,  flower:'🪻', theme:'theme-lv2', hintMode:'always',   label:'익스퍼트' },
  lv3: { rows:22, cols:24, mines:105, flower:'🏵️', theme:'theme-lv3', hintMode:'always',   label:'마스터' },
  lv4: { rows:26, cols:28, mines:150, flower:'🌺', theme:'theme-lv4', hintMode:'always',   label:'익스트림' },
  lv5: { rows:30, cols:30, mines:190, flower:'🪷', theme:'theme-lv5', hintMode:'always',   label:'멘사' }
};
const LEVEL_ORDER = ['lv1','lv2','lv3','lv4','lv5'];
const WILTED = '🥀';
let SIZE = 30;                 // hex circumradius (recalculated per screen size)
let HEX_W = Math.round(SIZE*Math.sqrt(3));
let HEX_H = SIZE*2;
let ROW_STEP = HEX_H*0.75;

// ---------- board zoom (pure display scale — never touches game state) ----------
const ZOOM_LEVELS = [1, 1.25, 1.5, 1.75];
const ZOOM_KEY = 'hexagarden:zoom';
let zoomLevel = 1;
try{
  const savedZoom = Number(localStorage.getItem(ZOOM_KEY));
  if(ZOOM_LEVELS.includes(savedZoom)) zoomLevel = savedZoom;
}catch(e){}

function updateHexMetrics(){
  const frameWidth = document.querySelector('.board-frame').clientWidth || window.innerWidth;
  const availableForBoard = Math.max(180, frameWidth - 60); // minus padding + row-hint gutter
  const perColumn = availableForBoard / (cols + 0.5);
  let size = perColumn / Math.sqrt(3);
  size = Math.max(18, Math.min(38, size));
  size = size * zoomLevel;
  SIZE = size;

function make2D(r,c,val){
  const g=[];
  for(let i=0;i<r;i++){ g.push(new Array(c).fill(val)); }
  return g;
}

// ---------- hex neighbor math (odd-r offset via axial conversion) ----------
function offsetToAxial(col,row){
  return { q: col - (row - (row & 1)) / 2, r: row };
}
function axialToOffset(q,r){
  return { col: q + (r - (r & 1)) / 2, row: r };
}
const AXIAL_DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
function neighborsOf(row,col,rr,cc){
  const {q,r} = offsetToAxial(col,row);
  const result=[];
  for(const [dq,dr] of AXIAL_DIRS){
    const off = axialToOffset(q+dq, r+dr);
    if(off.row>=0 && off.row<rr && off.col>=0 && off.col<cc){
      result.push({row:off.row, col:off.col});
    }
  }
  return result;
}

// ---------- generation with no-guess validation ----------
function tryGenerate(rr,cc,mc,safeR,safeC){
  const safeSet = new Set();
  safeSet.add(safeR+','+safeC);
  for(const n of neighborsOf(safeR,safeC,rr,cc)) safeSet.add(n.row+','+n.col);

  const candidates = [];
  for(let r=0;r<rr;r++) for(let c=0;c<cc;c++){
    if(!safeSet.has(r+','+c)) candidates.push({row:r,col:c});
  }
  // shuffle
  for(let i=candidates.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [candidates[i],candidates[j]] = [candidates[j],candidates[i]];
  }
  const mg = make2D(rr,cc,false);
  for(let i=0;i<mc && i<candidates.length;i++){
    mg[candidates[i].row][candidates[i].col] = true;
  }
  const ag = make2D(rr,cc,0);
  for(let r=0;r<rr;r++) for(let c=0;c<cc;c++){
    if(mg[r][c]) continue;
    let cnt=0;
    for(const n of neighborsOf(r,c,rr,cc)) if(mg[n.row][n.col]) cnt++;
    ag[r][c]=cnt;
  }

  const sim = { rows:rr, cols:cc, mineGrid:mg, adjGrid:ag, revealed:make2D(rr,cc,false), flagged:make2D(rr,cc,false) };
  floodReveal(safeR,safeC,sim);
  solve(sim);

  let safeRevealed=0;
  for(let r=0;r<rr;r++) for(let c=0;c<cc;c++){
    if(sim.revealed[r][c]) safeRevealed++;
  }
  const totalSafe = rr*cc - mc;
  return { solved: safeRevealed===totalSafe, mineGrid:mg, adjGrid:ag };
}

function floodReveal(row,col,state){
  if(state.revealed[row][col] || state.mineGrid[row][col]) return;
  state.revealed[row][col]=true;
  if(state.adjGrid[row][col]===0){
    for(const n of neighborsOf(row,col,state.rows,state.cols)){
      if(!state.mineGrid[n.row][n.col] && !state.revealed[n.row][n.col]){
        floodReveal(n.row,n.col,state);
      }
    }
  }
}

function solve(state){
  let progress = true;
  while(progress){
    progress = false;
    const constraints = [];
    for(let r=0;r<state.rows;r++){
      for(let c=0;c<state.cols;c++){
        if(state.revealed[r][c]){
          const nbs = neighborsOf(r,c,state.rows,state.cols);
          const unknown=[]; let flaggedCount=0;
          for(const n of nbs){
            if(state.flagged[n.row][n.col]) flaggedCount++;
            else if(!state.revealed[n.row][n.col]) unknown.push(n);
          }
          if(unknown.length>0){
            constraints.push({ cells:unknown, rem: state.adjGrid[r][c]-flaggedCount });
          }
        }
      }
    }
    for(const con of constraints){
      if(con.rem===0){
        for(const cell of con.cells){
          if(!state.revealed[cell.row][cell.col]){ floodReveal(cell.row,cell.col,state); progress=true; }
        }
      } else if(con.rem===con.cells.length){
        for(const cell of con.cells){
          if(!state.flagged[cell.row][cell.col]){ state.flagged[cell.row][cell.col]=true; progress=true; }
        }
      }
    }
    if(progress) continue;

    let found=false;
    for(let i=0;i<constraints.length && !found;i++){
      for(let j=0;j<constraints.length && !found;j++){
        if(i===j) continue;
        const A=constraints[i], B=constraints[j];
        const setA = new Set(A.cells.map(x=>x.row+','+x.col));
        const setB = new Set(B.cells.map(x=>x.row+','+x.col));
        if(setA.size===0 || setB.size===0 || setA.size>=setB.size) continue;
        let subset=true;
        for(const k of setA){ if(!setB.has(k)){ subset=false; break; } }
        if(!subset) continue;
        const diffCells = B.cells.filter(x=>!setA.has(x.row+','+x.col));
        const diffRem = B.rem - A.rem;
        if(diffRem===0){
          for(const cell of diffCells){
            if(!state.revealed[cell.row][cell.col]){ floodReveal(cell.row,cell.col,state); progress=true; }
          }
          found = progress;
        } else if(diffRem===diffCells.length){
          for(const cell of diffCells){
            if(!state.flagged[cell.row][cell.col]){ state.flagged[cell.row][cell.col]=true; progress=true; }
          }
          found = progress;
        }
      }
    }
  }
}

function generateWithRetry(rr,cc,mc,safeR,safeC){
  // solved !== true인 판은 어떠한 경우에도 반환하지 않는다.
  // mines가 0이 되면 인접한 지뢰가 전혀 없어 첫 클릭 한 번에 전체가 flood-reveal되므로
  // solved가 반드시 true가 되어 이 루프는 항상 종료된다.
  let mines = mc;
  while(true){
    for(let attempt=0; attempt<400; attempt++){
      const res = tryGenerate(rr,cc,mines,safeR,safeC);
      if(res.solved) return { mineGrid:res.mineGrid, adjGrid:res.adjGrid, mines };
    }
    mines = Math.max(0, mines-1);
  }
}

function mergeRecords(a,b){
  const out = { best:{...(a&&a.best||{})}, garden:{...(a&&a.garden||{})}, campaignBest: (a&&a.campaignBest!=null)?a.campaignBest:null };
  if(b){
    LEVEL_ORDER.forEach(k=>{
      if(b.best && b.best[k]!=null){
        if(out.best[k]==null || b.best[k]<out.best[k]) out.best[k]=b.best[k];
      }
      if(b.garden && b.garden[k]!=null){
        out.garden[k] = Math.max(out.garden[k]||0, b.garden[k]);
      }
    });
    if(b.campaignBest!=null){
      if(out.campaignBest==null || b.campaignBest<out.campaignBest) out.campaignBest=b.campaignBest;
    }
  }
  return out;
}

    if(rows.length===0){

      const rec = records[ch.id]||{best:{}};
      return {ch, time:rec.best[rankTab]};
    }).filter(r=>r.time!=null).sort((a,b)=>a.time-b.time);
    if(rows.length===0){
      list.innerHTML = '<div class="rank-empty">아직 이 난이도를 클리어한 사람이 없어요</div>';
    } else {
      rows.forEach((r,i)=>list.appendChild(buildRankRow(i, r.ch, formatTime(r.time))));
    }
  }
  rankingPanel.appendChild(list);

  if(!cloudAvailable){
    const note = document.createElement('div');
    note.className = 'rank-note';
    note.textContent = '※ 지금은 이 기기에 저장된 기록만 보여요. 가족 전체 기록을 하나로 모으려면 클라우드 연동이 필요해요.';
    rankingPanel.appendChild(note);
  }
}
async function openRanking(){
  rankingPanel.innerHTML = '<div class="rank-empty">불러오는 중...</div>';
  const { records, cloudAvailable } = await gatherAllRecords();
  renderRankingPanel(records, cloudAvailable);
}
rankingBtn.addEventListener('click', ()=>{
  const open = rankingPanel.classList.toggle('open');
  rankingBtn.textContent = open ? '🏆 랭킹 닫기' : '🏆 랭킹 보기';
  if(open) openRanking();
});

// ---------- watercolor flower backgrounds ----------
function makeFlowerSVG(petals, petalColor, centerColor, washColor1, washColor2, opacity){
  let petalShapes = '';
  for(let i=0;i<petals;i++){
    const angle = (360/petals)*i;
    petalShapes += '<ellipse cx="50" cy="28" rx="12" ry="19" fill="'+petalColor+'" transform="rotate('+angle+' 50 50)"/>';
  }
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">'
    + '<defs><radialGradient id="w" cx="35%" cy="30%" r="75%">'
    + '<stop offset="0%" stop-color="'+washColor1+'" stop-opacity="0.9"/>'
    + '<stop offset="60%" stop-color="'+washColor2+'" stop-opacity="0.45"/>'
    + '<stop offset="100%" stop-color="'+washColor2+'" stop-opacity="0"/>'
    + '</radialGradient></defs>'
    + '<g opacity="'+opacity+'">'
    + '<rect width="100" height="100" fill="url(#w)"/>'
    + '<g opacity="0.75">'+petalShapes+'</g>'
    + '<circle cx="50" cy="50" r="9" fill="'+centerColor+'"/>'
    + '</g></svg>';
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
const FLOWER_PARAMS = {
  lv1: { petals:8,  petal:'#D98BA0', center:'#B23A56', wash1:'#F3D3DC', wash2:'#EFC2D2' },
  lv2: { petals:6,  petal:'#B79EF0', center:'#6B4FB0', wash1:'#E8DFFB', wash2:'#D3C2F5' },
  lv3: { petals:12, petal:'#8E6BA0', center:'#4A3355', wash1:'#E4D5F0', wash2:'#C9AFDA' },
  lv4: { petals:5,  petal:'#C23B4E', center:'#8E1F30', wash1:'#FBD9DE', wash2:'#F0AEB9' },
  lv5: { petals:9,  petal:'#C9A227', center:'#96751A', wash1:'#FBEFC9', wash2:'#EAD98C' }
};
const FLOWER_BG = {}, FLOWER_BG_FAINT = {};
LEVEL_ORDER.forEach(k=>{
  const p = FLOWER_PARAMS[k];
  FLOWER_BG[k] = makeFlowerSVG(p.petals,p.petal,p.center,p.wash1,p.wash2, 0.8);
  FLOWER_BG_FAINT[k] = makeFlowerSVG(p.petals,p.petal,p.center,p.wash1,p.wash2, 0.22);
});
function applyFlowerBg(lvl){
  document.body.style.setProperty('--flower-bg', 'url("'+FLOWER_BG[lvl]+'")');
  document.body.style.setProperty('--flower-bg-faint', 'url("'+FLOWER_BG_FAINT[lvl]+'")');
}

function renderOptionRow(){
  const cfg = LEVELS[level];
  optionRow.innerHTML = '';
  optionRow.classList.remove('locked');
  if(cfg.hintMode==='none'){
    showRowHints = false;
    optionRow.textContent = '';
  } else if(cfg.hintMode==='optional'){
    const label = document.createElement('label');
    label.style.display='flex'; label.style.alignItems='center'; label.style.gap='6px'; label.style.cursor='pointer';
    const cb = document.createElement('input');
    cb.type='checkbox'; cb.checked = showRowHints;
    cb.addEventListener('change', ()=>{ showRowHints = cb.checked; renderBoard(); });
    label.appendChild(cb);
    label.appendChild(document.createTextNode('가로줄 잡초 총합 힌트 보기'));
    optionRow.appendChild(label);
  } else if(cfg.hintMode==='always'){
    showRowHints = true;
    optionRow.classList.add('locked');
    optionRow.textContent = '🚩 가로줄 잡초 총합 힌트 항상 표시';
  }
}

function updateBestDisplay(){
  const t = currentRecord.best[level];
  bestEl.textContent = t!=null ? ('최고 기록: ' + t + '초') : '';
}

function startGame(){
  const cfg = LEVELS[level];
  applyFlowerBg(level);
  rows = cfg.rows; cols = cfg.cols; mineCount = cfg.mines;
  mineGrid=null; adjGrid=null;
  revealed = make2D(rows,cols,false);
  flagged = make2D(rows,cols,false);
  revealedSafeCount = 0;
  gameOver = false;
  gameWon = false;
  firstClick = true;
  seconds = 0;
  clearInterval(timerInterval);
  timerEl.textContent='0';
  mineCountEl.textContent = mineCount;
  msgEl.textContent = '첫 칸을 눌러 화단을 열어보세요';
  potEl.className = 'pot';
  potEl.textContent = '🪴';
  renderOptionRow();
  updateBestDisplay();
  updateHexMetrics();
  layoutBoard();
  renderEmptyBoard();
}

function relayout(){
  if(!rows || !cols) return;
  updateHexMetrics();
  layoutBoard();
  const cells = boardEl.children;
  for(let i=0;i<cells.length;i++){
    const btn = cells[i];
    const r = +btn.dataset.row, c = +btn.dataset.col;
    const {left,top} = cellPixelPos(r,c);
    btn.style.left = left+'px';
    btn.style.top = top+'px';
    btn.style.width = HEX_W+'px';
    btn.style.height = HEX_H+'px';
  }
  renderRowHints();
}
let relayoutTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(relayoutTimer);
  relayoutTimer = setTimeout(relayout, 150);
});

function layoutBoard(){
  const width = HEX_W*cols + HEX_W/2;
  const height = ROW_STEP*(rows-1) + HEX_H;
  boardEl.style.width = width+'px';
  boardEl.style.height = height+'px';
}

function cellPixelPos(row,col){
  const left = col*HEX_W + (row%2 ? HEX_W/2 : 0);
  const top = row*ROW_STEP;
  return {left,top};
}

// ---------- unified pointer input: 손가락/S Pen/정전식 펜/마우스가 전부 이 한 경로로만 처리됨 ----------
// click을 그대로 두고 pointerup을 얹으면 같은 입력이 두 번 처리될 수 있어 click은 아예 쓰지 않는다.
// 개별 버튼의 clip-path 히트테스트에 기대지 않고 좌표에서 "가장 가까운 헥스 칸"을 직접 계산해서 쓴다 —
// 정전식 펜은 촉이 굵고 좌표가 흔들려서, 칸 경계(clip-path 바깥 여백)에 살짝만 걸쳐도 엉뚱한 칸이나
// 빈 틈으로 판정되는 문제가 있었음.
const TAP_MOVE_TOLERANCE = 10; // px — 이 이상 움직이면 스크롤/드래그로 간주, 칸 조작 취소
let tapPointerId = null;
let tapStartX = 0, tapStartY = 0;
let tapMoved = false;
let tapCell = null;

function pixelToCell(clientX, clientY){
  const rect = boardEl.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;
  const approxRow = Math.round(y / ROW_STEP);
  let best = null, bestDist = Infinity;
  for(let dr=-1; dr<=1; dr++){
    const r = approxRow + dr;
    if(r<0 || r>=rows) continue;
    const approxCol = Math.round((x - (r%2 ? HEX_W/2 : 0)) / HEX_W);
    for(let dc=-1; dc<=1; dc++){
      const c = approxCol + dc;
      if(c<0 || c>=cols) continue;
      const {left,top} = cellPixelPos(r,c);
      const cx = left + HEX_W/2, cy = top + HEX_H/2;
      const dist = (x-cx)*(x-cx) + (y-cy)*(y-cy);
      if(dist < bestDist){ bestDist = dist; best = {r,c}; }
    }
  }
  return best;
}

boardEl.addEventListener('pointerdown', (e)=>{
  if(e.pointerType==='mouse' && e.button!==0) return; // 우클릭은 contextmenu가 처리
  const cell = pixelToCell(e.clientX, e.clientY);
  if(!cell) return;
  tapPointerId = e.pointerId;
  tapStartX = e.clientX; tapStartY = e.clientY;
  tapMoved = false;
  tapCell = cell;
});
boardEl.addEventListener('pointermove', (e)=>{
  if(e.pointerId!==tapPointerId) return;
  if(Math.abs(e.clientX-tapStartX)>TAP_MOVE_TOLERANCE || Math.abs(e.clientY-tapStartY)>TAP_MOVE_TOLERANCE){
    tapMoved = true;
  }
});
const endTap = (e)=>{
  if(e.pointerId!==tapPointerId) return;
  const wasTap = !tapMoved;
  const cell = tapCell;
  tapPointerId = null; tapCell = null;
  if(!wasTap || !cell) return; // 스크롤/드래그였으면 칸 조작하지 않음
  e.preventDefault();
  handleCellClick(cell.r, cell.c);
};
boardEl.addEventListener('pointerup', endTap);
boardEl.addEventListener('pointercancel', (e)=>{ if(e.pointerId===tapPointerId){ tapPointerId=null; tapCell=null; } });

function renderEmptyBoard(){
  boardEl.innerHTML='';
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const btn = document.createElement('button');
      btn.className='cell';
      const {left,top} = cellPixelPos(r,c);
      btn.style.left=left+'px';
      btn.style.top=top+'px';
      btn.style.width=HEX_W+'px';
      btn.style.height=HEX_H+'px';
      btn.dataset.row=r; btn.dataset.col=c;
      const fill = document.createElement('div');
      fill.className = 'cell-fill';
      btn.appendChild(fill);
      boardEl.appendChild(btn);
    }
  }
  renderRowHints();
}

function renderRowHints(){
  rowHintsEl.innerHTML='';
  rowHintsEl.style.paddingTop='0px';
  for(let r=0;r<rows;r++){
    const div = document.createElement('div');
    div.className='row-hint';
    div.style.height = ROW_STEP+'px';
    if(r===rows-1) div.style.height = HEX_H+'px';
    if(showRowHints && rowMineCounts.length){
      div.textContent = '🥀'+rowMineCounts[r];
    }
    rowHintsEl.appendChild(div);
  }
}

function renderBoard(){
  const cells = boardEl.children;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const idx = r*cols+c;
      const btn = cells[idx];
      const fill = btn.querySelector('.cell-fill');
      btn.className='cell';
      fill.className='cell-fill';
      fill.textContent='';
      if(revealed[r][c]){
        btn.classList.add('revealed');
        if(mineGrid && mineGrid[r][c]){
          btn.classList.add('mine');
          fill.textContent = WILTED;
        } else {
          const n = adjGrid[r][c];
          if(n>0){ fill.textContent=n; fill.classList.add('n'+n); }
          else { fill.textContent = LEVELS[level].flower; }
        }
      } else if(flagged[r][c]){
        btn.classList.add('flagged');
        fill.textContent = '🚩';
      }
    }
  }
  renderRowHints();
}

function handleCellClick(r,c){
  if(gameOver||gameWon) return;

  if(firstClick){
    const gen = generateWithRetry(rows,cols,mineCount,r,c);
    mineGrid = gen.mineGrid;
    adjGrid = gen.adjGrid;
    mineCount = gen.mines;
    mineCountEl.textContent = mineCount;
    rowMineCounts = [];
    for(let rr=0;rr<rows;rr++){
      let cnt=0;
      for(let cc=0;cc<cols;cc++) if(mineGrid[rr][cc]) cnt++;
      rowMineCounts.push(cnt);
    }
    firstClick=false;
    startTimer();
  }

  if(flagPlacementMode){ handleFlag(r,c); return; }

  if(flagged[r][c]) return;
  if(revealed[r][c]) return;

  if(mineGrid[r][c]){
    revealed[r][c]=true;
    for(let rr=0;rr<rows;rr++) for(let cc=0;cc<cols;cc++) if(mineGrid[rr][cc]) revealed[rr][cc]=true;
    renderBoard();
    const cells = boardEl.children;
    cells[r*cols+c].classList.add('exploded');
    endGame(false);
    return;
  }

  const state = {rows,cols,mineGrid,adjGrid,revealed,flagged};
  floodReveal(r,c,state);
  renderBoard();
  checkWin();
}

function handleFlag(r,c){
  if(gameOver||gameWon||firstClick) return;
  if(revealed[r][c]) return;
  flagged[r][c] = !flagged[r][c];
  renderBoard();
  updateMineCounter();
}

function countFlags(){
  let cnt=0;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(flagged[r][c]) cnt++;
  return cnt;
}
function updateMineCounter(){
  mineCountEl.textContent = mineCount - countFlags();
}

function countRevealed(){
  let cnt=0;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(revealed[r][c] && !mineGrid[r][c]) cnt++;
  return cnt;
}

function checkWin(){
  const totalSafe = rows*cols - mineCount;
  if(countRevealed()===totalSafe){
    endGame(true);
  }
}

function endGame(won){
  gameOver=!won; gameWon=won;
  clearInterval(timerInterval);
  if(won){
    potEl.className='pot win';
    potEl.textContent = LEVELS[level].flower+'✨';
    const isNew = recordBest(level, seconds);
    bestEl.textContent = isNew ? ('🎉 새 기록! ' + seconds + '초') : ('최고 기록: ' + currentRecord.best[level] + '초');
    launchConfetti();
    recordGardenIncrement(level);
    if(gardenPanel.classList.contains('open')) renderGardenPanel(currentRecord.garden);
    if(campaignMode){
      campaignAdvance();
    } else {
      msgEl.textContent = '🎉 화단이 완성됐어요! 추측 없이 논리로 다 풀었어요!';
    }
  } else {
    potEl.className='pot';
    potEl.textContent='🥀';
    msgEl.textContent = campaignMode
      ? '앗, 잡초였어요. ↻ 버튼으로 이 단계를 다시 시도하세요 (시간은 계속 흘러요!)'
      : '앗, 잡초였어요. 사실 힌트로 확정할 수 있는 칸이었어요 — 다시 살펴보며 도전해봐요!';
  }
}

function startTimer(){
  timerInterval = setInterval(()=>{ seconds++; timerEl.textContent=seconds; }, 1000);
}

function launchConfetti(){
  const flower = LEVELS[level].flower;
  const emojis = [flower,'✨','🌿'];
  for(let i=0;i<24;i++){
    setTimeout(()=>{
      const span=document.createElement('div');
      span.className='confetti';
      span.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      span.style.left = Math.random()*100+'vw';
      span.style.animationDuration = (2+Math.random()*1.5)+'s';
      document.body.appendChild(span);
      setTimeout(()=>span.remove(),3600);
    }, i*60);
  }
}

// ---------- boot ----------
renderCharGrid();
let savedChar = null;
try{ savedChar = localStorage.getItem(LAST_CHAR_KEY); }catch(e){}
if(savedChar && CHARACTERS.some(c=>c.id===savedChar)){
  selectCharacter(savedChar);
} else {
  charOverlay.classList.remove('hidden');
}
